name: Build Windows EXE

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

# 发布 Release 需要写仓库内容的权限
permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Build with PyInstaller
        run: |
          pyinstaller --noconfirm --onefile --windowed `
            --name "音乐播放器" `
            --icon app.ico `
            --add-data "player.html;." `
            --collect-submodules webview `
            --collect-submodules mutagen `
            --hidden-import pythonnet `
            app.py

      - name: Verify build output
        run: |
          if (!(Test-Path "dist/音乐播放器.exe")) { Write-Error "exe not found"; exit 1 }
          Get-Item "dist/音乐播放器.exe" | Select-Object Name, Length

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: 音乐播放器-exe
          path: dist/音乐播放器.exe
          if-no-files-found: error

      - name: Prepare release assets
        if: startsWith(github.ref, 'refs/tags/')
        run: Copy-Item "dist/音乐播放器.exe" "dist/LocalMusicPlayer.exe"

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.exe
          generate_release_notes: true
