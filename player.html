<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>本地音乐播放器</title>
<style>
  :root{
    --bg:#0c0d12; --txt:#eef0f6; --txt2:#8a90a0; --txt3:#5b6072;
    --teal:#2fd6c4; --blue:#3a7bff; --line:rgba(255,255,255,.08);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
    background:radial-gradient(900px 600px at 50% -10%,rgba(58,123,255,.12),transparent 60%),
               radial-gradient(700px 500px at 50% 110%,rgba(47,214,196,.10),transparent 55%),var(--bg);
    color:var(--txt);height:100vh;overflow:hidden;user-select:none;
  }
  .wrap{height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;position:relative}

  /* 窗口控制(无边框) */
  .topctrl{position:fixed;top:10px;right:14px;display:flex;gap:8px;z-index:30}
  .topctrl button{width:30px;height:30px;border-radius:8px;border:1px solid var(--line);background:rgba(255,255,255,.05);color:var(--txt2);cursor:pointer;font-size:14px;line-height:1;transition:.15s}
  .topctrl button:hover{color:#fff;background:rgba(255,255,255,.12)}
  .topctrl button.on{color:var(--teal);border-color:var(--teal)}
  /* 列表浮层打开时，隐藏窗口控制与浮动列表按钮，避免与浮层头部按钮重叠 */
  body.list-open #topctrl{display:none !important}

  /* 缩放手柄（无边框窗口自定义缩放） */
  .rz{position:fixed;z-index:40;background:transparent;touch-action:none}
  .rz.n{top:0;left:0;right:0;height:6px;cursor:ns-resize}
  .rz.s{bottom:0;left:0;right:0;height:6px;cursor:ns-resize}
  .rz.w{top:0;bottom:0;left:0;width:6px;cursor:ew-resize}
  .rz.e{top:0;bottom:0;right:0;width:6px;cursor:ew-resize}
  .rz.ne{top:0;right:0;width:12px;height:12px;cursor:nesw-resize}
  .rz.nw{top:0;left:0;width:12px;height:12px;cursor:nwse-resize}
  .rz.se{bottom:0;right:0;width:12px;height:12px;cursor:nwse-resize}
  .rz.sw{bottom:0;left:0;width:12px;height:12px;cursor:nesw-resize}
  .rz:hover{background:rgba(120,170,255,.12)}

  /* 选择文件夹 */
  #picker{text-align:center;max-width:420px}
  #picker h1{font-size:20px;font-weight:700;margin-bottom:8px}
  #picker p{color:var(--txt2);font-size:13px;line-height:1.7;margin-bottom:22px}
  .pick-btn{
    display:inline-flex;align-items:center;gap:10px;padding:13px 24px;border:none;border-radius:999px;cursor:pointer;font:inherit;
    background:linear-gradient(135deg,var(--blue),var(--teal));color:#fff;font-size:14px;font-weight:600;
    box-shadow:0 10px 30px rgba(58,123,255,.35);transition:.18s;
  }
  .pick-btn:hover{transform:translateY(-2px);box-shadow:0 14px 36px rgba(58,123,255,.45)}
  #fileInput{display:none}

  /* 播放器主体 */
  #app{display:none;width:100%;max-width:520px;flex-direction:column;align-items:center}
  .folder-name{position:fixed;top:14px;left:14px;color:var(--txt3);font-size:12px;max-width:50vw;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .title{font-size:24px;font-weight:700;text-align:center;margin-bottom:6px;max-width:90%}
  .artist{font-size:13px;color:var(--txt2);text-align:center;margin-bottom:30px}

  .bar{display:flex;align-items:center;gap:10px;font-size:11.5px;color:var(--txt3);font-variant-numeric:tabular-nums;width:100%}
  .progress{flex:1;height:6px;border-radius:999px;background:rgba(255,255,255,.1);position:relative;cursor:pointer}
  .progress .fill{position:absolute;left:0;top:0;bottom:0;border-radius:999px;background:linear-gradient(90deg,var(--teal),var(--blue));width:0;box-shadow:0 0 10px rgba(47,214,196,.5)}
  .progress .knob{position:absolute;top:50%;width:13px;height:13px;border-radius:50%;background:#fff;transform:translate(-50%,-50%);left:0;opacity:0;transition:.15s;box-shadow:0 2px 6px rgba(0,0,0,.4)}
  .progress:hover .knob{opacity:1}

  .controls{display:flex;align-items:center;justify-content:center;gap:18px;padding:0 6px;margin-top:22px}
  .btn{background:none;border:none;color:var(--txt2);cursor:pointer;display:flex;align-items:center;justify-content:center;border-radius:50%;transition:.15s}
  .btn:hover{color:#fff}
  .btn.sm{width:40px;height:40px}
  .btn.sm svg{width:20px;height:20px}
  .btn.play{width:64px;height:64px;background:linear-gradient(135deg,var(--blue),var(--teal));color:#fff;box-shadow:0 10px 30px rgba(58,123,255,.5)}
  .btn.play:hover{transform:scale(1.05);color:#fff}
  .btn.play svg{width:28px;height:28px}
  .btn.on{color:var(--teal)}
  .rep-ico{position:relative;display:inline-flex;align-items:center;justify-content:center}
  .rep-1{position:absolute;right:-4px;bottom:-3px;font-size:11px;font-weight:700;line-height:1;color:var(--teal);background:rgba(10,12,18,.9);border-radius:6px;padding:1px 3px;display:none}

  .vol{display:flex;align-items:center;gap:8px;margin-top:24px;color:var(--txt3)}
  .vol input[type=range]{width:130px}
  input[type=range]{-webkit-appearance:none;appearance:none;height:4px;border-radius:999px;background:rgba(255,255,255,.15);outline:none;cursor:pointer}
  input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:13px;height:13px;border-radius:50%;background:#fff;box-shadow:0 1px 4px rgba(0,0,0,.4)}
  input[type=range]::-moz-range-thumb{width:13px;height:13px;border:none;border-radius:50%;background:#fff}

  .folder-btn{margin-top:20px;background:rgba(255,255,255,.06);border:1px solid var(--line);color:var(--txt2);font:inherit;font-size:12.5px;padding:8px 18px;border-radius:999px;cursor:pointer;transition:.15s;display:inline-flex;align-items:center;gap:6px}
  .folder-btn:hover{color:#fff;background:rgba(255,255,255,.12)}

  /* 列表浮层 */
  .overlay{position:fixed;inset:0;background:rgba(8,9,13,.85);backdrop-filter:blur(8px);display:none;flex-direction:column;z-index:20}
  .overlay.show{display:flex}
  .ov-head{display:flex;align-items:center;gap:10px;padding:16px 18px;border-bottom:1px solid var(--line)}
  .ov-head input{flex:1;background:rgba(255,255,255,.06);border:1px solid var(--line);border-radius:10px;padding:10px 14px;color:var(--txt);font-size:13px;outline:none}
  .ov-head input:focus{border-color:var(--blue)}
  .ov-list{flex:1;overflow-y:auto;padding:8px 10px 30px}
  .row{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:10px;cursor:pointer}
  .row:hover{background:rgba(255,255,255,.05)}
  .row.active{background:linear-gradient(90deg,rgba(58,123,255,.18),transparent)}
  .row .n{font-size:13px;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .row.active .n{color:#fff;font-weight:600}
  .ov-count{padding:10px 18px;color:var(--txt3);font-size:12px;border-top:1px solid var(--line)}

  /* 删除按钮（列表行右侧，悬停显示） */
  .row .del{opacity:0;flex:0 0 auto;width:26px;height:26px;border:none;border-radius:8px;background:none;color:var(--txt3);cursor:pointer;display:flex;align-items:center;justify-content:center;transition:.15s}
  .row:hover .del{opacity:1}
  .row .del:hover{color:#ff6b6b;background:rgba(255,90,90,.14)}
  .row .del svg{width:16px;height:16px}

  /* 删除确认弹窗 */
  .confirm{position:fixed;inset:0;background:rgba(0,0,0,.6);backdrop-filter:blur(4px);display:none;align-items:center;justify-content:center;z-index:60}
  .confirm.show{display:flex}
  .confirm-box{width:min(86vw,340px);background:#1c1e28;border:1px solid var(--line);border-radius:14px;padding:20px;box-shadow:0 24px 70px rgba(0,0,0,.55)}
  .confirm-title{font-size:15px;font-weight:700;margin-bottom:10px}
  .confirm-text{font-size:13px;color:var(--txt2);line-height:1.7;white-space:pre-wrap;word-break:break-all;margin-bottom:18px}
  .confirm-actions{display:flex;gap:10px;justify-content:flex-end}
  .confirm-actions button{font:inherit;font-size:13px;padding:8px 16px;border-radius:9px;border:1px solid var(--line);background:rgba(255,255,255,.06);color:var(--txt);cursor:pointer;transition:.15s}
  .confirm-actions button:hover{background:rgba(255,255,255,.12)}
  .confirm-actions .danger{background:linear-gradient(135deg,#ff5b5b,#ff3d6e);border:none;color:#fff;font-weight:600}
  .confirm-actions .danger:hover{filter:brightness(1.08)}

  /* 裁剪按钮（列表行，悬停显示） */
  .row .ed{opacity:0;flex:0 0 auto;width:26px;height:26px;border:none;border-radius:8px;background:none;color:var(--txt3);cursor:pointer;display:flex;align-items:center;justify-content:center;transition:.15s}
  .row:hover .ed{opacity:1}
  .row .ed:hover{color:var(--teal);background:rgba(47,214,196,.14)}
  .row .ed svg{width:16px;height:16px}

  /* 裁剪编辑器 */
  .trim{position:fixed;inset:0;background:rgba(4,5,8,.72);backdrop-filter:blur(6px);display:none;align-items:center;justify-content:center;z-index:55;padding:16px}
  .trim.show{display:flex}
  .trim-box{width:min(100%,460px);background:#161821;border:1px solid var(--line);border-radius:16px;padding:16px 16px 13px;box-shadow:0 24px 70px rgba(0,0,0,.6);max-height:100%;overflow:auto}
  .trim-head{display:flex;align-items:center;gap:10px;margin-bottom:12px}
  .trim-title{font-size:14px;font-weight:700;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .trim-x{width:26px;height:26px;border:none;border-radius:8px;background:rgba(255,255,255,.06);color:var(--txt2);cursor:pointer;font-size:13px;line-height:1;flex:0 0 auto}
  .trim-x:hover{color:#fff;background:rgba(255,255,255,.14)}
  .trim-wave{position:relative;height:96px;border-radius:10px;background:rgba(255,255,255,.04);overflow:hidden;cursor:crosshair;user-select:none}
  .trim-wave canvas{display:block;width:100%;height:100%}
  .trim-dim{position:absolute;top:0;bottom:0;background:rgba(6,7,11,.62);pointer-events:none}
  .trim-dim.l{left:0;width:0}
  .trim-dim.r{right:0;width:0}
  .trim-ph{position:absolute;top:0;bottom:0;width:1px;background:rgba(255,255,255,.8);left:0;pointer-events:none}
  .trim-h{position:absolute;top:0;bottom:0;width:13px;margin-left:-6.5px;cursor:ew-resize;z-index:3;display:flex;align-items:center;justify-content:center}
  .trim-h::before{content:'';position:absolute;top:0;bottom:0;left:6px;width:2px;background:var(--teal);box-shadow:0 0 10px rgba(47,214,196,.85)}
  .trim-h::after{content:'';width:13px;height:24px;border-radius:6px;background:var(--teal);box-shadow:0 2px 8px rgba(0,0,0,.5)}
  .trim-time{display:flex;justify-content:space-between;font-size:12px;color:var(--txt3);margin:11px 2px 13px;font-variant-numeric:tabular-nums}
  .trim-time b{color:var(--txt);font-weight:600}
  .trim-actions{display:flex;gap:8px}
  .trim-actions button{font:inherit;font-size:12.5px;padding:9px 13px;border-radius:9px;border:1px solid var(--line);background:rgba(255,255,255,.06);color:var(--txt);cursor:pointer;transition:.15s;white-space:nowrap}
  .trim-actions button:hover{background:rgba(255,255,255,.13)}
  .trim-actions button:disabled{opacity:.55;cursor:default}
  .trim-actions .grow{flex:1}
  .trim-actions .primary{background:linear-gradient(135deg,var(--blue),var(--teal));border:none;color:#fff;font-weight:600}
  .trim-hint{margin-top:9px;font-size:11.5px;color:var(--txt3);line-height:1.6}
  .trim-hint b{color:var(--txt2)}
  .trim-loading{position:absolute;inset:0;display:none;align-items:center;justify-content:center;font-size:12px;color:var(--txt2);background:rgba(12,13,18,.6)}

  /* 拖放提示 */
  .dropzone{position:fixed;inset:14px;border:2px dashed rgba(47,214,196,.5);border-radius:18px;
    display:none;align-items:center;justify-content:center;font-size:18px;color:var(--teal);
    background:rgba(12,13,18,.6);z-index:40;pointer-events:none;font-weight:600}

  ::-webkit-scrollbar{width:8px}
  ::-webkit-scrollbar-thumb{background:rgba(255,255,255,.12);border-radius:8px}
  .toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(20px);background:#1c1e28;color:#fff;padding:10px 18px;border-radius:10px;font-size:13px;opacity:0;transition:.25s;pointer-events:none;border:1px solid var(--line);z-index:50}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
</style>
</head>
<body>
<div class="wrap">
  <div class="topctrl" id="topctrl">
    <button id="listBtn" title="曲目列表">☰</button>
    <button id="minBtn" title="最小化">—</button>
    <button id="closeBtn" title="关闭">✕</button>
  </div>

  <!-- 选择文件夹 -->
  <div id="picker">
    <h1>🎵 本地音乐播放器</h1>
    <p>选择音乐文件夹后，下次打开会自动加载，无需重复操作。<br>也可以把文件夹<b>直接拖进窗口</b>临时播放。</p>
    <button class="pick-btn" id="pickBtn">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 7h6l2 2h10v10H3z"/></svg>
      选择音乐文件夹
    </button>
    <input id="fileInput" type="file" webkitdirectory directory multiple>
  </div>

  <!-- 播放器 -->
  <div id="app">
    <div class="folder-name" id="folderName"></div>
    <div class="title" id="npTitle">未在播放</div>
    <div class="artist" id="npArtist"></div>

    <div class="bar">
      <span id="cur">0:00</span>
      <div class="progress" id="progress"><div class="fill" id="fill"></div><div class="knob" id="knob"></div></div>
      <span id="dur">0:00</span>
    </div>

    <div class="controls">
      <button class="btn sm" id="shuffle" title="随机播放">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M16 3h5v5"/><path d="M4 20L21 3"/><path d="M21 16v5h-5"/><path d="M15 15l6 6"/><path d="M4 4l5 5"/></svg>
      </button>
      <button class="btn sm" id="prev" title="上一首">
        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M6 5h2v14H6zM20 5L9 12l11 7z"/></svg>
      </button>
      <button class="btn play" id="play" title="播放/暂停">
        <svg id="playIcon" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
      </button>
      <button class="btn sm" id="next" title="下一首">
        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M16 5h2v14h-2zM4 5l11 7L4 19z"/></svg>
      </button>
      <button class="btn sm" id="repeat" title="循环模式">
        <span class="rep-ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 2l4 4-4 4"/><path d="M3 11V9a4 4 0 014-4h14"/><path d="M7 22l-4-4 4-4"/><path d="M21 13v2a4 4 0 01-4 4H3"/></svg><span class="rep-1" id="repeatOne">1</span></span>
      </button>
    </div>

    <div class="vol">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M3 9v6h4l5 5V4L7 9H3z"/><path d="M16 8a4 4 0 010 8" fill="none" stroke="currentColor" stroke-width="2"/></svg>
      <input type="range" id="volume" min="0" max="1" step="0.01" value="0.9">
    </div>

    <button class="folder-btn" id="changeFolder">📁 更换文件夹</button>
  </div>
</div>

<!-- 列表浮层 -->
<div class="overlay" id="overlay">
  <div class="ov-head">
    <input id="search" placeholder="搜索歌名…" autocomplete="off">
    <div class="icon-btn" id="closeList" title="关闭" style="width:34px;height:34px;border:1px solid var(--line);border-radius:10px;display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--txt2)">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 6l12 12M18 6L6 18"/></svg>
    </div>
  </div>
  <div class="ov-list" id="ovList"></div>
  <div class="ov-count" id="ovCount"></div>
</div>

<!-- 删除/覆盖确认弹窗 -->
<div class="confirm" id="confirmMask">
  <div class="confirm-box">
    <div class="confirm-title" id="confirmTitle">删除歌曲</div>
    <div class="confirm-text" id="confirmText"></div>
    <div class="confirm-actions">
      <button id="confirmCancel">取消</button>
      <button id="confirmOk" class="danger">永久删除</button>
    </div>
  </div>
</div>

<!-- 裁剪编辑器 -->
<div class="trim" id="trimMask">
  <div class="trim-box">
    <div class="trim-head">
      <div class="trim-title" id="trimName">裁剪音频</div>
      <button class="trim-x" id="trimClose" title="关闭">✕</button>
    </div>
    <div class="trim-wave" id="trimWave">
      <canvas id="trimCanvas"></canvas>
      <div class="trim-dim l" id="trimDimL"></div>
      <div class="trim-dim r" id="trimDimR"></div>
      <div class="trim-ph" id="trimPh"></div>
      <div class="trim-h" id="trimHs" data-h="s"></div>
      <div class="trim-h" id="trimHe" data-h="e"></div>
      <div class="trim-loading" id="trimLoading">正在读取音频波形…</div>
    </div>
    <div class="trim-time">
      <span>开始 <b id="trimStartT">0:00</b></span>
      <span>结束 <b id="trimEndT">0:00</b></span>
      <span>保留 <b id="trimLenT">0:00</b></span>
    </div>
    <div class="trim-actions">
      <button id="trimPreview">▶ 试听</button>
      <button class="grow" id="trimCancel">取消</button>
      <button class="primary" id="trimSave">覆盖保存</button>
    </div>
    <div class="trim-hint">拖动两侧手柄选择要保留的片段，点波形可移动播放位置。保存会<b>覆盖原文件</b>；按 MP3 帧边界切割、不重新编码，音质与原来一致。</div>
  </div>
</div>

<div class="dropzone" id="dropzone">松开以加载音乐</div>
<div class="toast" id="toast"></div>

<!-- 缩放手柄（鼠标移到边框/角落显示对应光标并拖拽改尺寸） -->
<div class="rz n"  data-dir="n"></div>
<div class="rz s"  data-dir="s"></div>
<div class="rz w"  data-dir="w"></div>
<div class="rz e"  data-dir="e"></div>
<div class="rz ne" data-dir="ne"></div>
<div class="rz nw" data-dir="nw"></div>
<div class="rz se" data-dir="se"></div>
<div class="rz sw" data-dir="sw"></div>
<audio id="audio" preload="metadata"></audio>

<script>
(function(){
  const audio = document.getElementById('audio');
  const $ = id => document.getElementById(id);
  const AUDIO_EXT = /\.(mp3|flac|m4a|wav|ogg|aac|wma)$/i;
  const API_PORT = __API_PORT__;
  function jslog(m){ if(!API_PORT) return; try{ new Image().src = 'http://127.0.0.1:'+API_PORT+'/_js?m='+encodeURIComponent(m); }catch(e){} }
  window.addEventListener('error', function(e){ jslog('ERR ' + (e.message||'') + ' @' + (e.lineno||'?')); });
  function lsGet(k){ try{ return localStorage.getItem(k); }catch(e){ return null; } }
  function lsSet(k,v){ try{ localStorage.setItem(k,v); }catch(e){} }
  jslog('script-start');

  let tracks = [], queue = [], pos = 0, curIndex = -1, shuffle = false, repeat = 0;
  let curURL = null, dragging = false;

  /* 调用 pywebview 暴露的窗口接口（浏览器中无此法，安全降级） */
  function apiCall(name, ...args){
    try{
      if(window.pywebview && window.pywebview.api && typeof window.pywebview.api[name]==='function')
        return window.pywebview.api[name](...args);
    }catch(e){}
    return Promise.resolve(null);
  }
  function onReady(cb){
    if(window.pywebview) cb();
    else document.addEventListener('pywebviewready', cb, {once:true});
  }

  function fmt(sec){ if(sec==null||isNaN(sec))return '--:--'; sec=Math.floor(sec); const m=Math.floor(sec/60),s=sec%60; return m+':'+(s<10?'0':'')+s; }
  function escapeHtml(s){return (s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
  function toast(m){const t=$('toast');t.textContent=m;t.classList.add('show');clearTimeout(t._t);t._t=setTimeout(()=>t.classList.remove('show'),1500)}
  function baseName(n){return n.replace(/\.[^.]+$/,'')}

  /* ---------- 加载曲目：File 对象数组（拖入 / 网页版选择） ---------- */
  function ingestFiles(fileLike){
    const arr = Array.from(fileLike).filter(f => AUDIO_EXT.test(f.name));
    if(!arr.length){ toast('没有可播放的音乐文件'); return; }
    const map = {}; arr.forEach(f => map[f.name.toLowerCase()] = f);
    tracks = arr.map(f => ({
      name: f.name, title: baseName(f.name), file: f, url: null, duration: null, lrc: null
    }));
    tracks.sort((a,b)=>a.title.localeCompare(b.title,'zh'));
    showPlayer();
    rebuildQueue(); renderList(); loadIndex(queue[0], true);
    toast('已加载 '+tracks.length+' 首');
  }

  function ingestTracks(list, lastTrack){

      duration:(t.duration!=null?+t.duration:null), lrc:null
    }));
    showPlayer();
    rebuildQueue(); renderList();
    let idx = 0;
    if(lastTrack){ const k = tracks.findIndex(t=>t.name===lastTrack); if(k>=0) idx=k; }
    loadIndex(idx, !!lastTrack);   // 有记忆则尝试接续播放，否则仅定位首曲

  /* ---------- 拖拽移动窗口（无边框） ---------- */
  // 坐标一律用**物理像素**，后端直接 SetWindowPos / GetWindowRect。
  // 原因：WebView2 的 CSS 像素和 pywebview 的逻辑像素不一定是同一尺度（这台机器上
  // devicePixelRatio=2.625 而窗口 DPI 只有 1.75，差 1.5 倍），把 CSS 位移直接喂给
  // move() 时窗口只走三分之二，鼠标越拖越偏、来回修正，看起来就是"乱晃"。
  // e.screenX 是 CSS(DIP) 坐标，乘 devicePixelRatio 即物理像素，全程不做其他换算。
  // 另外：① 用缓存位置同步起拖，按下即跟手；② 超过阈值才算拖，纯点击不挪窗口；
  // ③ pointer capture 保证窗口外松手也能收到 pointerup，不留残留拖拽状态。
  let winPos = null;            // 最近已知窗口左上角（物理像素）{x,y}
  let winSize = null;           // 最近已知窗口尺寸（物理像素）{w,h}
  const DRAG_TOL = 4;           // 起拖阈值（物理像素）
  let dragP = null;             // {id,sx,sy,wx,wy,k,moved,busy,target}

  function dpr(){ return window.devicePixelRatio || 1; }

  function syncWinPos(){
    apiCall('win_pos').then(p=>{ if(p && p.length===2 && p[0]!=null) winPos={x:p[0], y:p[1]}; }, ()=>{});
  }

  function syncWinSize(){
    apiCall('win_size').then(s=>{ if(s && s.length===2) winSize={w:s[0], h:s[1]}; }, ()=>{});
  }

  function flushDrag(){
    const d = dragP;
    if(!d || !d.moved || d.busy || !d.target) return;
    const t = d.target; d.target = null; d.busy = true;
    winPos = {x:t.x, y:t.y};                    // 乐观更新，下一次拖拽直接用
    const done = ()=>{ if(dragP){ dragP.busy = false; flushDrag(); } };   // 单飞：不排队，只发最新目标
    apiCall('win_move', t.x, t.y).then(done, done);
  }

  document.addEventListener('pointerdown', e=>{
    if(e.button !== 0 || e.isPrimary === false) return;
    if(e.target.closest('button, input, .progress, .overlay, .row, .topctrl, .pick-btn, .rz, .trim, .confirm')) return;
    if(!winPos){ syncWinPos(); return; }        // 位置还没拿到，这次不拖（下次就好了）
    const k = dpr();
    dragP = {id:e.pointerId, sx:e.screenX, sy:e.screenY, wx:winPos.x, wy:winPos.y,

    if(!d.moved){
      if(Math.abs(dx) < DRAG_TOL && Math.abs(dy) < DRAG_TOL) return;
      d.moved = true;
    }
    d.target = {x: Math.round(d.wx + dx), y: Math.round(d.wy + dy)};

    if(d.target) apiCall('win_move', d.target.x, d.target.y).then(syncWinPos, syncWinPos);

  const MINW = 300, MINH = 400;          // 最小尺寸（CSS 像素，按当前屏幕缩放折算成物理像素）
  let rz = null, rzRAF = null, rzTarget = null;

  function beginResize(dir, e, w, h, wx, wy){
    rz = {dir, sx:e.screenX, sy:e.screenY, w, h, wx, wy, k:dpr()};
  }

  document.querySelectorAll('.rz').forEach(h=>{
    h.addEventListener('mousedown', e=>{
      e.preventDefault(); e.stopPropagation();

      if(winSize && winPos){ beginResize(dir, e, winSize.w, winSize.h, winPos.x, winPos.y); return; }
      onReady(()=>{
        Promise.all([apiCall('win_size'), apiCall('win_pos')]).then(([s, p])=>{
          if(!s) return;
          beginResize(dir, e, s[0], s[1], p ? p[0] : 0, p ? p[1] : 0);
          winSize = {w:s[0], h:s[1]};
          if(p) winPos = {x:p[0], y:p[1]};

      });
    });
  });

  document.addEventListener('mousemove', e=>{
    if(!rz) return;
    const dx = (e.screenX - rz.sx) * rz.k, dy = (e.screenY - rz.sy) * rz.k;
    const minW = MINW * rz.k, minH = MINH * rz.k;
    let w = rz.w, h = rz.h, wx = rz.wx, wy = rz.wy, move = false, changed = false;
    if(rz.dir.includes('e')){ w = Math.max(minW, rz.w + dx); changed = true; }
    if(rz.dir.includes('s')){ h = Math.max(minH, rz.h + dy); changed = true; }
    if(rz.dir.includes('w')){ w = Math.max(minW, rz.w - dx); wx = rz.wx + (rz.w - w); changed = true; move = true; }
    if(rz.dir.includes('n')){ h = Math.max(minH, rz.h - dy); wy = rz.wy + (rz.h - h); changed = true; move = true; }
    if(changed) rzTarget = {w:Math.round(w), h:Math.round(h), wx:Math.round(wx), wy:Math.round(wy), move};

      rzRAF = null;
      const t = rzTarget; rzTarget = null;
      if(!t) return;
      if(t.move) apiCall('win_move', t.wx, t.wy);
      apiCall('win_resize', t.w, t.h);
      winSize = {w:t.w, h:t.h};                     // 供下一次缩放直接同步起拖
      if(t.move) winPos = {x:t.wx, y:t.wy};
    });
  });

  function endResize(){
    if(!rz) return;
    rz = null; rzTarget = null;
    syncWinPos(); syncWinSize();                    // 松手后校准，避免高频调用累积误差
  }

  /* ---------- 拖入文件夹加载（临时，不记忆） ---------- */
  function readEntry(entry, out){
    return new Promise(res=>{
      if(entry.isFile){ entry.file(f=>{ out.push(f); res(); }); }
      else if(entry.isDirectory){
        const reader=entry.createReader(); let batch=[];
        const read=()=>reader.readEntries(ents=>{
          if(!ents.length){ Promise.all(batch.map(x=>readEntry(x,out))).then(res); }
          else { batch=batch.concat(Array.from(ents)); read(); }
        }, ()=>res());
        read();
      } else res();
    });
  }
  async function collectFiles(dt){
    const out=[];
    if(dt.items && dt.items.length){
      const entries=[];
      for(const it of dt.items){ if(it.kind==='file'){ const en=it.webkitGetAsEntry&&it.webkitGetAsEntry(); if(en) entries.push(en); } }
      for(const en of entries) await readEntry(en, out);
    }
    if(!out.length){ for(const f of dt.files) out.push(f); }
    return out;
  }

  /* ---------- 事件 ---------- */

  $('changeFolder').addEventListener('click', ()=>pickFolder(lib=>ingestTracks(lib.tracks, lib.last_track||null)));

  /* 音量记忆：写入后端配置（pywebview 里 localStorage 不可用，仅作网页版回退） */

  async function doDelete(i){

  /* ---------- 裁剪音频（只保留选区，覆盖原文件） ---------- */
  const trim = {i:-1, dur:0, start:0, end:0, peaks:null, preview:false};
  const tWave = $('trimWave'), tCanvas = $('trimCanvas');

  function pctOf(sec){ return trim.dur ? Math.max(0, Math.min(100, sec / trim.dur * 100)) : 0; }
  function secOf(clientX){
    const r = tWave.getBoundingClientRect();
    return Math.max(0, Math.min(1, (clientX - r.left) / r.width)) * trim.dur;
  }
  function peaksFrom(buf, buckets){
    const chs = Math.min(2, buf.numberOfChannels);
    const datas = [];
    for(let c=0;c<chs;c++) datas.push(buf.getChannelData(c));
    const len = buf.length, out = new Array(buckets).fill(0);
    const step = Math.max(1, Math.floor(len / buckets));
    for(let b=0;b<buckets;b++){
      const s = b*step, e = Math.min(len, s+step);
      let m = 0;
      for(let c=0;c<datas.length;c++){
        const d = datas[c];
        for(let k=s;k<e;k+=4){ const v = d[k] < 0 ? -d[k] : d[k]; if(v>m) m = v; }
      }
      out[b] = m;
    }
    const peak = Math.max.apply(null, out.concat([0.001]));
    return out.map(v=>Math.pow(v/peak, 0.72));   // 归一化 + 提升小音量段的可视性
  }
  function drawWave(){
    const dpr = window.devicePixelRatio || 1;
    const w = tWave.clientWidth || 300, h = tWave.clientHeight || 96;
    if(tCanvas.width !== Math.round(w*dpr) || tCanvas.height !== Math.round(h*dpr)){
      tCanvas.width = Math.round(w*dpr); tCanvas.height = Math.round(h*dpr);
    }
    const ctx = tCanvas.getContext('2d');
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.clearRect(0, 0, w, h);
    const mid = h/2;
    if(trim.peaks && trim.peaks.length){
      const n = trim.peaks.length, bw = w/n, gap = bw>2.5 ? 1 : 0;
      const g = ctx.createLinearGradient(0, 4, 0, h-4);
      g.addColorStop(0, '#4b8dff'); g.addColorStop(.5, '#2fd6c4'); g.addColorStop(1, '#4b8dff');
      ctx.fillStyle = g;
      for(let k=0;k<n;k++){
        const amp = Math.max(0.015, trim.peaks[k]) * (mid - 4);
        ctx.fillRect(k*bw, mid-amp, Math.max(1, bw-gap), amp*2);

      ctx.fillStyle = 'rgba(255,255,255,.12)';
      ctx.fillRect(0, mid-1, w, 2);
    }
  }

    setPreviewLabel(false);
    $('trimName').textContent = t.title;
    $('trimMask').classList.add('show');
    $('trimLoading').style.display = 'flex';
    trim.dur = (t.duration && !isNaN(t.duration) && t.duration > 0) ? t.duration
             : ((i === curIndex && audio.duration) ? audio.duration : 0);
    trim.start = 0; trim.end = trim.dur || 1;
    requestAnimationFrame(()=>{ drawWave(); layoutTrim(); });

    // 抓取音频解码出波形（失败则退化为纯色条）
    let buf = null;
    if(t.url){
      try{
        const res = await fetch(t.url + (t.url.indexOf('?')>=0?'&':'?') + 'v=' + (t.ver||0));
        const len = +(res.headers.get('content-length') || 0);
        if(!len || len < 60*1024*1024){
          const ab = await res.arrayBuffer();
          const AC = window.AudioContext || window.webkitAudioContext;
          if(AC){
            const ac = new AC();
            buf = await new Promise((ok, bad)=>{ ac.decodeAudioData(ab, ok, bad); });
            try{ ac.close(); }catch(e){}
          }
        }
      }catch(e){ jslog('wave-fail ' + ((e && e.message) || e)); buf = null; }
    }
    if(trim.i !== i) return;                 // 期间已关闭或切到别的歌
    if(buf && buf.duration){
      trim.dur = buf.duration;
      trim.peaks = peaksFrom(buf, 180);
      buf = null;
    }
    if(!trim.dur){ $('trimLoading').style.display = 'none'; toast('无法读取该音频的时长'); closeTrim(); return; }
    trim.start = 0; trim.end = trim.dur;
    $('trimLoading').style.display = 'none';
    drawWave(); layoutTrim();
  }
  function closeTrim(){
    stopPreview();
    trim.i = -1; trim.peaks = null;
    $('trimMask').classList.remove('show');
  }

  function togglePreview(){
    if(trim.i < 0) return;
    if(trim.preview){ stopPreview(); audio.pause(); return; }
    if(trim.i !== curIndex) loadIndex(trim.i, false);
    const go = ()=>{
      audio.currentTime = trim.start;
      audio.play().catch(()=>{});
      trim.preview = true; setPreviewLabel(true);
    };
    if(audio.readyState >= 1) go();
    else audio.addEventListener('loadedmetadata', go, {once:true});
  }

  function askTrimSave(){
    const t = tracks[trim.i]; if(!t) return;
    if(trim.end - trim.start < 1){ toast('至少保留 1 秒'); return; }
    showConfirm('覆盖原文件',
      '只保留 ' + fmt(trim.start) + ' – ' + fmt(trim.end) + '（' + fmt(trim.end-trim.start) + '）这段，覆盖：\n\n「' + t.title + '」\n\n原文件其余内容会丢失，无法撤销。',
      '确认覆盖', ()=>doTrimSave());
  }
  async function doTrimSave(){
    const i = trim.i, t = tracks[i]; if(!t) return;
    const s = trim.start, e = trim.end;
    const wasCurrent = (i === curIndex);
    const wasPlaying = !audio.paused;
    const btn = $('trimSave');
    btn.disabled = true; btn.textContent = '处理中…';
    stopPreview();
    if(wasCurrent){                             // 释放文件占用，便于替换
      try{ audio.pause(); }catch(err){}
      audio.removeAttribute('src'); try{ audio.load(); }catch(err){}
    }
    const res = await apiCall('trim_track', t.name, s, e);
    btn.disabled = false; btn.textContent = '覆盖保存';
    if(!res || !res.ok){
      toast('裁剪失败：' + ((res && res.error) || '未知错误'));
      if(wasCurrent) loadIndex(i, wasPlaying);
      return;
    }
    t.duration = res.duration;
    t.ver = Date.now();                         // 换 URL 版本，避开缓存
    closeTrim();
    if(wasCurrent){ loadIndex(i, wasPlaying); $('dur').textContent = fmt(res.duration); }
    else renderList();
    toast('已裁剪：保留 ' + fmt(res.start) + '–' + fmt(res.end));
  }

  $('trimClose').addEventListener('click', closeTrim);
  $('trimCancel').addEventListener('click', closeTrim);
  $('trimPreview').addEventListener('click', togglePreview);
  $('trimSave').addEventListener('click', askTrimSave);
  $('trimMask').addEventListener('click', e=>{ if(e.target === $('trimMask')) closeTrim(); });
  tWave.addEventListener('mousedown', e=>{
    e.preventDefault(); e.stopPropagation();
    const h = e.target.closest('.trim-h');
    if(h){ trimDrag = h.dataset.h; return; }
    if(trim.i === curIndex && audio.duration){
      audio.currentTime = Math.min(secOf(e.clientX), Math.max(0, audio.duration - 0.15));
      updateTrimPlayhead();
    }
  });
  let trimDrag = null;
  window.addEventListener('mousemove', e=>{
    if(!trimDrag) return;
    const GAP = 1;                              // 至少保留 1 秒
    const sec = secOf(e.clientX);
    if(trimDrag === 's') trim.start = Math.min(sec, trim.end - GAP);
    else trim.end = Math.max(sec, trim.start + GAP);
    trim.start = Math.max(0, Math.min(trim.start, trim.dur));
    trim.end = Math.max(0, Math.min(trim.end, trim.dur));
    layoutTrim();
  });
  window.addEventListener('mouseup', ()=>{ trimDrag = null; });
  audio.addEventListener('timeupdate', ()=>{
    if($('trimMask').classList.contains('show')) updateTrimPlayhead();
    if(trim.preview && trim.end && audio.currentTime >= trim.end - 0.03){
      audio.pause(); audio.currentTime = trim.start;
      stopPreview();
    }
  });
  window.addEventListener('resize', ()=>{ if($('trimMask').classList.contains('show')){ drawWave(); layoutTrim(); } });

  $('ovList').addEventListener('click', e=>{
    const ed = e.target.closest('.ed');
    if(ed){ e.stopPropagation(); openTrim(+ed.dataset.ed); return; }
    const del = e.target.closest('.del');
    if(del){ e.stopPropagation(); askDelete(+del.dataset.del); return; }
    const el = e.target.closest('.row'); if(!el) return; closeList(); playIndex(+el.dataset.i);
  });

  // 窗口控制按钮（右上角按钮已由 CSS 默认显示，不依赖 pywebview 就绪事件）
  $('closeBtn').addEventListener('click', ()=>apiCall('win_close'));
  $('minBtn').addEventListener('click', ()=>apiCall('win_min'));
  $('listBtn').addEventListener('click', openList);

  document.addEventListener('keydown', e=>{
    if($('confirmMask').classList.contains('show')){
      if(e.code==='Escape'){ e.preventDefault(); closeConfirm(); }
      return;
    }
    if($('trimMask').classList.contains('show')){
      if(e.code==='Escape'){ e.preventDefault(); closeTrim(); }
      else if(e.code==='Space'){ e.preventDefault(); togglePreview(); }
      return;
    }
    if(e.target.tagName==='INPUT')return;
    if(e.code==='Space'){e.preventDefault();toggle();}
    else if(e.code==='ArrowRight')next(false);
    else if(e.code==='ArrowLeft')prev();
    else if(e.code==='Escape')closeList();
  });

  const v0=lsGet('vol'); applyVolume(v0!==null ? +v0 : 0.9);   // 初始值（随后由后端记忆值覆盖）

  /* ---------- 启动：若已记忆目录，自动加载 ---------- */
  let booted = false, loggedWait = false;
  function tryBoot(){
    if(booted) return;
    if(!(window.pywebview && window.pywebview.api)){
      if(!loggedWait){ jslog('wait-api'); loggedWait = true; }
      setTimeout(tryBoot, 500); return;   // 轮询直到 API 就绪
    }
    booted = true;
    jslog('api-ready');
    syncWinPos(); syncWinSize();          // 预热窗口位置/尺寸缓存，让首次拖动就能同步起拖
    apiCall('get_library').then(lib=>{
      jslog('gl n=' + (lib?lib.tracks.length:'null'));
      if(lib && lib.volume!=null && !volTouched){ applyVolume(lib.volume); jslog('vol-cfg=' + lib.volume); }   // 恢复记忆音量
      if(lib && lib.tracks && lib.tracks.length) ingestTracks(lib.tracks, lib.last_track||null);
    });
  }
  document.addEventListener('pywebviewready', ()=>jslog('pywebviewready-evt'));
  onReady(tryBoot);
  tryBoot();
})();
</script>
</body>
</html>
